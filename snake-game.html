<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>贪吃蛇 · Snake</title>
<style>
  :root {
    --bg-0: #0a101d;
    --bg-1: #121d33;
    --grid: #182742;
    --grid-strong: #1e3153;
    --snake-head: #86efac;
    --snake-tail: #16a34a;
    --food: #f87171;
    --text: #e8eefb;
    --muted: #7f8ea9;
    --accent: #38bdf8;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px 16px;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1000px 620px at 8% -12%, #1d3a61 0%, transparent 62%),
      radial-gradient(820px 520px at 102% 112%, #0e3f3c 0%, transparent 58%),
      linear-gradient(160deg, var(--bg-0), var(--bg-1));
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .shell {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    padding: 0 4px;
  }

  .title {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .title span {
    background: linear-gradient(92deg, var(--snake-head), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.4px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .stat {
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 12px;
    padding: 9px 10px;
    text-align: center;
    backdrop-filter: blur(6px);
  }

  .stat .k {
    display: block;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.6px;
    margin-bottom: 3px;
  }

  .stat .v {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .stat .v.hot { color: var(--snake-head); }

  .board {
    position: relative;
    border-radius: 18px;
    padding: 10px;
    background: linear-gradient(150deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.015));
    border: 1px solid rgba(255, 255, 255, 0.09);
    box-shadow:
      0 24px 60px -24px rgba(0, 0, 0, 0.85),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .canvas-wrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    background: #0d1729;
  }

  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    padding: 20px;
    background: rgba(8, 14, 26, 0.78);
    backdrop-filter: blur(5px);
    transition: opacity 0.18s ease;
  }

  .overlay[hidden] { display: none; }

  .overlay .big {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }

  .overlay .small {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
  }

  .overlay .score-line {
    font-size: 15px;
    color: var(--text);
  }

  .overlay .score-line b {
    color: var(--snake-head);
    font-size: 20px;
  }

  .pill {
    margin-top: 6px;
    padding: 9px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: #04231a;
    background: linear-gradient(120deg, var(--snake-head), #34d399);
    box-shadow: 0 10px 26px -10px rgba(52, 211, 153, 0.85);
  }

  .hint {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 6px 12px;
    font-size: 12px;
    color: var(--muted);
  }

  .hint kbd {
    font-family: inherit;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 6px;
    color: var(--text);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .dpad {
    display: none;
    grid-template-columns: repeat(3, 62px);
    grid-template-rows: repeat(2, 62px);
    gap: 8px;
    justify-content: center;
    margin-top: 2px;
  }

  .dpad button {
    font-family: inherit;
    font-size: 20px;
    color: var(--text);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.06);
    cursor: pointer;
  }

  .dpad button:active {
    background: rgba(56, 189, 248, 0.22);
    border-color: rgba(56, 189, 248, 0.5);
  }

  .dpad .up { grid-column: 2; grid-row: 1; }
  .dpad .left { grid-column: 1; grid-row: 2; }
  .dpad .down { grid-column: 2; grid-row: 2; }
  .dpad .right { grid-column: 3; grid-row: 2; }

  @media (max-width: 620px), (pointer: coarse) {
    .dpad { display: grid; }
    .title { font-size: 19px; }
    .stat .v { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="head">
    <div>
      <h1 class="title">贪吃蛇 · <span>Snake</span></h1>
      <p class="subtitle">纯前端单文件小游戏，与项目代码无关</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><span class="k">得分</span><span class="v hot" id="score">0</span></div>
    <div class="stat"><span class="k">最高分</span><span class="v" id="best">0</span></div>
    <div class="stat"><span class="k">长度</span><span class="v" id="length">3</span></div>
    <div class="stat"><span class="k">速度</span><span class="v" id="speed">1.0x</span></div>
  </div>

  <div class="board">
    <div class="canvas-wrap">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay">
        <div class="big" id="overlayTitle">准备好了吗？</div>
        <div class="score-line" id="overlayScore" hidden></div>
        <div class="small" id="overlayText">方向键 / WASD 控制移动<br />吃到红色果实即可得分</div>
        <div class="pill" id="overlayBtn">开始游戏</div>
      </div>
    </div>
  </div>

  <div class="hint">
    <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>
    <span><kbd>空格</kbd> 暂停 / 继续</span>
    <span><kbd>R</kbd> 重新开始</span>
  </div>

  <div class="dpad">
    <button class="up" type="button" data-dir="up" aria-label="上">▲</button>
    <button class="left" type="button" data-dir="left" aria-label="左">◀</button>
    <button class="down" type="button" data-dir="down" aria-label="下">▼</button>
    <button class="right" type="button" data-dir="right" aria-label="右">▶</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var COLS = 20;
  var ROWS = 20;
  var CELL = 26;
  var W = COLS * CELL;
  var H = ROWS * CELL;

  var BASE_STEP = 135;
  var MIN_STEP = 62;
  var SPEED_STEP_DECAY = 4;

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');

  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var lengthEl = document.getElementById('length');
  var speedEl = document.getElementById('speed');

  var overlay = document.getElementById('overlay');
  var overlayTitle = document.getElementById('overlayTitle');
  var overlayText = document.getElementById('overlayText');
  var overlayScore = document.getElementById('overlayScore');
  var overlayBtn = document.getElementById('overlayBtn');

  var BEST_KEY = 'pinglu-snake-best';

  var snake = [];
  var dir = { x: 1, y: 0 };
  var pendingDirs = [];
  var food = null;
  var score = 0;
  var best = readBest();
  var status = 'idle';
  var stepMs = BASE_STEP;
  var acc = 0;
  var lastTime = 0;
  var rafId = null;

  function readBest() {
    try {
      var raw = window.localStorage.getItem(BEST_KEY);
      var value = raw === null ? 0 : parseInt(raw, 10);
      return isNaN(value) || value < 0 ? 0 : value;
    } catch (err) {
      return 0;
    }
  }

  function writeBest(value) {
    try {
      window.localStorage.setItem(BEST_KEY, String(value));
    } catch (err) {
      /* storage unavailable, ignore */
    }
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    var cssSize = Math.max(1, Math.round(rect.width || W));
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssSize * dpr);
    canvas.height = Math.round(cssSize * dpr);
    var scale = canvas.width / W;
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
  }

  function roundRect(x, y, w, h, r) {
    var radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
  }

  function mixChannel(a, b, t) {
    return Math.round(a + (b - a) * t);
  }

  function segmentColor(t) {
    // head #86efac -> tail #16a34a
    var r = mixChannel(134, 22, t);
    var g = mixChannel(239, 163, t);
    var b = mixChannel(172, 74, t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  function spawnFood() {
    var occupied = {};
    for (var i = 0; i < snake.length; i++) {
      occupied[snake[i].x + ',' + snake[i].y] = true;
    }

    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (!occupied[x + ',' + y]) free.push({ x: x, y: y });
      }
    }

    if (!free.length) {
      food = null;
      return;
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function reset() {
    snake = [
      { x: 8, y: 10 },
      { x: 7, y: 10 },
      { x: 6, y: 10 }
    ];
    dir = { x: 1, y: 0 };
    pendingDirs = [];
    score = 0;
    stepMs = BASE_STEP;
    acc = 0;
    spawnFood();
    syncStats();
  }

  function syncStats() {
    scoreEl.textContent = String(score);
    bestEl.textContent = String(best);
    lengthEl.textContent = String(snake.length);
    speedEl.textContent = (BASE_STEP / stepMs).toFixed(1) + 'x';
  }

  function showOverlay(title, text, button, scoreLine) {
    overlayTitle.textContent = title;
    overlayText.innerHTML = text;
    overlayBtn.textContent = button;
    if (scoreLine) {
      overlayScore.innerHTML = scoreLine;
      overlayScore.hidden = false;
    } else {
      overlayScore.hidden = true;
    }
    overlay.hidden = false;
  }

  function hideOverlay() {
    overlay.hidden = true;
  }

  function queueDir(x, y) {
    if (status !== 'running') return;
    var last = pendingDirs.length ? pendingDirs[pendingDirs.length - 1] : dir;
    if (last.x === -x && last.y === -y) return;
    if (last.x === x && last.y === y) return;
    if (pendingDirs.length >= 2) return;
    pendingDirs.push({ x: x, y: y });
  }

  function step() {
    if (pendingDirs.length) {
      dir = pendingDirs.shift();
    }

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver();
      return;
    }

    var ate = food && head.x === food.x && head.y === food.y;
    var limit = ate ? snake.length : snake.length - 1;
    for (var i = 0; i < limit; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        gameOver();
        return;
      }
    }

    snake.unshift(head);

    if (ate) {
      score += 10;
      stepMs = Math.max(MIN_STEP, BASE_STEP - snake.length * SPEED_STEP_DECAY);
      if (score > best) {
        best = score;
        writeBest(best);
      }
      spawnFood();
      if (!food) {
        win();
        return;
      }
    } else {
      snake.pop();
    }

    syncStats();
  }

  function start() {
    reset();
    status = 'running';
    hideOverlay();
    acc = 0;
    lastTime = performance.now();
    ensureLoop();
  }

  function pause() {
    if (status !== 'running') return;
    status = 'paused';
    showOverlay('已暂停', '按空格或点击下方按钮继续游戏', '继续游戏');
  }

  function resume() {
    if (status !== 'paused') return;
    status = 'running';
    hideOverlay();
    lastTime = performance.now();
    acc = 0;
  }

  function togglePause() {
    if (status === 'running') pause();
    else if (status === 'paused') resume();
  }

  function gameOver() {
    status = 'over';
    syncStats();
    showOverlay(
      '游戏结束',
      '别灰心，再来一次吧',
      '重新开始',
      '本局得分 <b>' + score + '</b> ｜ 最高分 ' + best
    );
  }

  function win() {
    status = 'over';
    syncStats();
    showOverlay(
      '完美通关！',
      '你填满了整块棋盘',
      '再来一局',
      '本局得分 <b>' + score + '</b> ｜ 最高分 ' + best
    );
  }

  function drawGrid() {
    ctx.fillStyle = '#0d1729';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = 'rgba(120, 160, 220, 0.09)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = 1; x < COLS; x++) {
      ctx.moveTo(x * CELL + 0.5, 0);
      ctx.lineTo(x * CELL + 0.5, H);
    }
    for (var y = 1; y < ROWS; y++) {
      ctx.moveTo(0, y * CELL + 0.5);
      ctx.lineTo(W, y * CELL + 0.5);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(120, 160, 220, 0.18)';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, W - 2, H - 2);
  }

  function drawFood(time) {
    if (!food) return;

    var cx = food.x * CELL + CELL / 2;
    var cy = food.y * CELL + CELL / 2;
    var pulse = 1 + Math.sin(time / 260) * 0.09;
    var radius = (CELL / 2 - 4) * pulse;

    ctx.save();
    ctx.shadowColor = 'rgba(248, 113, 113, 0.85)';
    ctx.shadowBlur = 16;

    var grad = ctx.createRadialGradient(cx - radius * 0.32, cy - radius * 0.32, radius * 0.15, cx, cy, radius);
    grad.addColorStop(0, '#fecaca');
    grad.addColorStop(0.55, '#f87171');
    grad.addColorStop(1, '#dc2626');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(cx - radius * 0.3, cy - radius * 0.34, radius * 0.2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnake() {
    var total = Math.max(snake.length - 1, 1);

    ctx.save();
    ctx.shadowColor = 'rgba(74, 222, 128, 0.35)';
    ctx.shadowBlur = 12;

    for (var i = snake.length - 1; i >= 0; i--) {
      var seg = snake[i];
      var t = i / total;
      var inset = 1.6 + t * 1.2;
      var size = CELL - inset * 2;

      ctx.fillStyle = segmentColor(t);
      roundRect(seg.x * CELL + inset, seg.y * CELL + inset, size, size, 8 - t * 2);
      ctx.fill();
    }

    ctx.restore();
    drawEyes();
  }

  function drawEyes() {
    var head = snake[0];
    var cx = head.x * CELL + CELL / 2;
    var cy = head.y * CELL + CELL / 2;
    var offset = CELL * 0.19;
    var forward = CELL * 0.16;

    var perpendicular = { x: -dir.y, y: dir.x };
    var eyeA = { x: cx + perpendicular.x * offset + dir.x * forward, y: cy + perpendicular.y * offset + dir.y * forward };
    var eyeB = { x: cx - perpendicular.x * offset + dir.x * forward, y: cy - perpendicular.y * offset + dir.y * forward };

    ctx.fillStyle = '#0b1a12';
    ctx.beginPath();
    ctx.arc(eyeA.x, eyeA.y, CELL * 0.085, 0, Math.PI * 2);
    ctx.arc(eyeB.x, eyeB.y, CELL * 0.085, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.beginPath();
    ctx.arc(eyeA.x - 1, eyeA.y - 1, CELL * 0.032, 0, Math.PI * 2);
    ctx.arc(eyeB.x - 1, eyeB.y - 1, CELL * 0.032, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw(time) {
    drawGrid();
    drawFood(time);
    drawSnake();
  }

  function loop(time) {
    rafId = window.requestAnimationFrame(loop);

    if (!lastTime) lastTime = time;
    var delta = time - lastTime;
    lastTime = time;

    if (delta > 250) delta = 250;

    if (status === 'running') {
      acc += delta;
      var guard = 0;
      while (acc >= stepMs && status === 'running' && guard < 8) {
        acc -= stepMs;
        step();
        guard++;
      }
    }

    draw(time);
  }

  function ensureLoop() {
    if (rafId === null) {
      lastTime = 0;
      rafId = window.requestAnimationFrame(loop);
    }
  }

  // ---------- input ----------

  var KEY_DIRS = {
    ArrowUp: [0, -1],
    ArrowDown: [0, 1],
    ArrowLeft: [-1, 0],
    ArrowRight: [1, 0],
    w: [0, -1],
    s: [0, 1],
    a: [-1, 0],
    d: [1, 0]
  };

  window.addEventListener('keydown', function (event) {
    if (event.ctrlKey || event.metaKey || event.altKey) return;

    var key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
    var mapped = KEY_DIRS[key];

    if (mapped) {
      event.preventDefault();
      if (status === 'idle' || status === 'over') {
        start();
      } else if (status === 'paused') {
        resume();
      }
      queueDir(mapped[0], mapped[1]);
      return;
    }

    if (event.code === 'Space') {
      event.preventDefault();
      if (status === 'idle' || status === 'over') start();
      else togglePause();
      return;
    }

    if (key === 'r') {
      event.preventDefault();
      start();
    }
  });

  overlay.addEventListener('click', function () {
    if (status === 'idle' || status === 'over') start();
    else if (status === 'paused') resume();
  });

  var touchStart = null;

  canvas.addEventListener('touchstart', function (event) {
    if (event.touches.length !== 1) return;
    touchStart = { x: event.touches[0].clientX, y: event.touches[0].clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', function (event) {
    if (!touchStart) return;
    var touch = event.changedTouches[0];
    var dx = touch.clientX - touchStart.x;
    var dy = touch.clientY - touchStart.y;
    touchStart = null;

    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      queueDir(dx > 0 ? 1 : -1, 0);
    } else {
      queueDir(0, dy > 0 ? 1 : -1);
    }
  }, { passive: true });

  var DPAD_DIRS = {
    up: [0, -1],
    down: [0, 1],
    left: [-1, 0],
    right: [1, 0]
  };

  Array.prototype.forEach.call(document.querySelectorAll('.dpad button'), function (button) {
    button.addEventListener('click', function () {
      var dirPair = DPAD_DIRS[button.getAttribute('data-dir')];
      if (status === 'idle' || status === 'over') start();
      else if (status === 'paused') resume();
      queueDir(dirPair[0], dirPair[1]);
    });
  });

  window.addEventListener('resize', function () {
    resize();
    draw(performance.now());
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && status === 'running') pause();
  });

  // ---------- boot ----------
  reset();
  resize();
  syncStats();
  showOverlay('准备好了吗？', '方向键 / WASD 控制移动<br />吃到红色果实即可得分', '开始游戏');
  ensureLoop();
})();
</script>
</body>
</html>
